<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои виджеты для Notion — lianacheprofe</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #37352f;
      --muted: #787774;
      --border: #e9e9e7;
      --accent: #2383e2;
      --accent-hover: #1b6ec2;
      --success: #0f7b6c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card: #202020;
        --text: #ffffffcf;
        --muted: #9b9b9b;
        --border: #2f2f2f;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 700;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .gh-btn {
      text-decoration: none;
      font-size: 13px;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--card);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .gh-btn:hover { opacity: 0.8; }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .file-info {
      min-width: 0;
      flex: 1;
    }
    .file-name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .file-url {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button.copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button.copy-btn:hover { background: var(--accent-hover); }
    button.copy-btn.copied { background: var(--success); }
    a.preview-btn {
      text-decoration: none;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 13px;
      white-space: nowrap;
    }
    a.preview-btn:hover { color: var(--text); }
    .status {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Мои виджеты для Notion</h1>
        <div class="subtitle">Автоматический каталог папки lianacheprofe / widgets</div>
      </div>
      <a class="gh-btn" href="https://github.com/lianacheprofe/widgets" target="_blank">+ Загрузить файл на GitHub</a>
    </header>

    <input type="text" id="search" class="search-input" placeholder="Поиск упражнения по названию...">

    <div id="list" class="list">
      <div class="status">Загружаю список упражнений...</div>
    </div>
  </div>

  <script>
    const USER = 'lianacheprofe';
    const REPO = 'widgets';
    const BASE_URL = `https://${USER}.github.io/${REPO}/`;

    let allFiles = [];

    async function loadWidgets() {
      const listEl = document.getElementById('list');
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
        if (!res.ok) throw new Error('Не удалось загрузить список файлов');
        const data = await res.json();

        allFiles = data.filter(item =>
          item.type === 'file' &&
          item.name.toLowerCase().endsWith('.html') &&
          item.name.toLowerCase() !== 'index.html'
        );

        renderList(allFiles);
      } catch (err) {
        listEl.innerHTML = `<div class="status">Ошибка загрузки: ${err.message}. Попробуй обновить страницу через минуту.</div>`;
      }
    }

    function renderList(files) {
      const listEl = document.getElementById('list');
      if (files.length === 0) {
        listEl.innerHTML = '<div class="status">Упражнения не найдены.</div>';
        return;
      }

      listEl.innerHTML = '';
      files.forEach(file => {
        const fullUrl = BASE_URL + encodeURIComponent(file.name);

        const row = document.createElement('div');
        row.className = 'item';

        row.innerHTML = `
          <div class="file-info">
            <div class="file-name">${file.name}</div>
            <div class="file-url">${fullUrl}</div>
          </div>
          <div class="actions">
            <a class="preview-btn" href="${fullUrl}" target="_blank">Открыть ↗</a>
            <button class="copy-btn" data-url="${fullUrl}">Скопировать для Notion</button>
          </div>
        `;

        const btn = row.querySelector('.copy-btn');
        btn.addEventListener('click', async () => {
          await navigator.clipboard.writeText(fullUrl);
          const original = btn.textContent;
          btn.textContent = '✓ Скопировано!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove('copied');
          }, 1800);
        });

        listEl.appendChild(row);
      });
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allFiles.filter(f => f.name.toLowerCase().includes(q));
      renderList(filtered);
    });

    loadWidgets();
  </script>
</body>
</html>
